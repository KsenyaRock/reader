name: voice
# Хмарна озвучка: EPUB за посиланням -> озвучка Edge TTS -> книга в Cloudflare R2 -> повідомлення в Telegram.
# Голос Apple (gender=apple): 5 Intel-Mac паралельно (apple) -> збірка на Linux (apple-join) -> apple-failed при збої.
# Запуск вручну: Actions -> voice -> Run workflow. Секрети (Settings -> Secrets and variables -> Actions): R2_ENDPOINT, R2_BUCKET,
# R2_KEY_ID, R2_SECRET, R2_PUBLIC_BASE, SUPABASE_URL, SUPABASE_ANON_KEY, READER_UPLOAD_KEY.
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/voice.yml']   # лише щоб GitHub зареєстрував workflow; сама озвучка запускається вручну
  workflow_dispatch:
    inputs:
      epub_url:
        description: 'Посилання на .epub (https://...)'
        required: true
      gender:
        description: 'Голос'
        type: choice
        options: [female, male, apple]
        default: female
      jobs:
        description: 'Паралельних запитів'
        default: '12'
      job_id:
        description: 'Номер задачі з читалки (порожньо, якщо запуск вручну)'
        required: false
        default: ''
      shards:
        description: 'Голоси Edge: на скільки серверів ділити книгу (1 = звичайна озвучка, 3 або 5 = тест розподілу)'
        required: false
        default: '1'
concurrency:
  group: voice
  cancel-in-progress: false
jobs:
  voice:
    if: github.event_name == 'workflow_dispatch' && inputs.gender != 'apple' && (inputs.shards == '' || inputs.shards == '1')
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Сховати посилання на EPUB у журналі (репозиторій публічний)
        env:
          EPUB_URL: ${{ inputs.epub_url }}
        run: |
          echo "::add-mask::$EPUB_URL"
          for t in $(echo "$EPUB_URL" | grep -oE '[a-f0-9]{32}'); do echo "::add-mask::$t"; done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install edge-tts mutagen
      - name: Озвучка і завантаження
        env:
          EPUB_URL: ${{ inputs.epub_url }}
          GENDER: ${{ inputs.gender }}
          JOBS: ${{ inputs.jobs }}
          JOB_ID: ${{ inputs.job_id }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_KEY_ID: ${{ secrets.R2_KEY_ID }}
          R2_SECRET: ${{ secrets.R2_SECRET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          READER_UPLOAD_KEY: ${{ secrets.READER_UPLOAD_KEY }}
        run: python3 tool/cloud_job.py
      - name: Позначити задачу як невдалу (збій, скасування або перевищення часу)
        if: ${{ (failure() || cancelled()) && inputs.job_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          READER_UPLOAD_KEY: ${{ secrets.READER_UPLOAD_KEY }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          curl -sS -m 30 -X POST "$SUPABASE_URL/rest/v1/rpc/reader_job_update" \
            -H "Content-Type: application/json" -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -d "{\"k\":\"$READER_UPLOAD_KEY\",\"p_job\":$JOB_ID,\"p_status\":\"failed\",\"p_err\":\"Озвучка перервалась (див. журнал запуску на GitHub)\"}" || true

  # Голоси Edge на кількох Linux-серверах (тест з 13.11.2026, лише коли shards = 2..5; читалка поки передає 1):
  # кожен сервер озвучує свою частку фрагментів і кладе їх у тимчасову теку сховища, edge-join збирає книгу.
  edge-split:
    if: github.event_name == 'workflow_dispatch' && inputs.gender != 'apple' && inputs.shards != '' && inputs.shards != '1'
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(inputs.shards == '2' && '[0,1]' || inputs.shards == '3' && '[0,1,2]' || inputs.shards == '4' && '[0,1,2,3]' || '[0,1,2,3,4]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      EPUB_URL: ${{ inputs.epub_url }}
      GENDER: ${{ inputs.gender }}
      JOBS: ${{ inputs.jobs }}
      SHARDS: ${{ inputs.shards }}
      JOB_ID: ${{ inputs.job_id }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_KEY_ID: ${{ secrets.R2_KEY_ID }}
      R2_SECRET: ${{ secrets.R2_SECRET }}
      R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      READER_UPLOAD_KEY: ${{ secrets.READER_UPLOAD_KEY }}
      SHARD: ${{ matrix.shard }}
      STAGE: edge-shard
    steps:
      - name: Сховати посилання на EPUB у журналі (репозиторій публічний)
        run: |
          echo "::add-mask::$EPUB_URL"
          for t in $(echo "$EPUB_URL" | grep -oE '[a-f0-9]{32}'); do echo "::add-mask::$t"; done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install edge-tts mutagen
      - name: Озвучка частини ${{ matrix.shard }}
        run: python3 tool/cloud_job.py

  edge-join:
    needs: edge-split
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EPUB_URL: ${{ inputs.epub_url }}
      GENDER: ${{ inputs.gender }}
      JOBS: ${{ inputs.jobs }}
      SHARDS: ${{ inputs.shards }}
      JOB_ID: ${{ inputs.job_id }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_KEY_ID: ${{ secrets.R2_KEY_ID }}
      R2_SECRET: ${{ secrets.R2_SECRET }}
      R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      READER_UPLOAD_KEY: ${{ secrets.READER_UPLOAD_KEY }}
      STAGE: edge-join
    steps:
      - name: Сховати посилання на EPUB у журналі (репозиторій публічний)
        run: |
          echo "::add-mask::$EPUB_URL"
          for t in $(echo "$EPUB_URL" | grep -oE '[a-f0-9]{32}'); do echo "::add-mask::$t"; done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install mutagen
      - name: Збірка книги з частин і завантаження
        run: python3 tool/cloud_job.py

  edge-failed:
    needs: [edge-split, edge-join]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.gender != 'apple' && inputs.shards != '' && inputs.shards != '1' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EPUB_URL: ${{ inputs.epub_url }}
      GENDER: ${{ inputs.gender }}
      JOBS: ${{ inputs.jobs }}
      SHARDS: ${{ inputs.shards }}
      JOB_ID: ${{ inputs.job_id }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_KEY_ID: ${{ secrets.R2_KEY_ID }}
      R2_SECRET: ${{ secrets.R2_SECRET }}
      R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      READER_UPLOAD_KEY: ${{ secrets.READER_UPLOAD_KEY }}
      STAGE: edge-cleanup
    steps:
      - name: Сховати посилання на EPUB у журналі (репозиторій публічний)
        run: |
          echo "::add-mask::$EPUB_URL"
          for t in $(echo "$EPUB_URL" | grep -oE '[a-f0-9]{32}'); do echo "::add-mask::$t"; done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Прибрати тимчасові частини зі сховища
        run: python3 tool/cloud_job.py || true
      - name: Позначити задачу як невдалу (збій, скасування або перевищення часу)
        if: ${{ inputs.job_id != '' }}
        run: |
          curl -sS -m 30 -X POST "$SUPABASE_URL/rest/v1/rpc/reader_job_update" \
            -H "Content-Type: application/json" -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -d "{\"k\":\"$READER_UPLOAD_KEY\",\"p_job\":$JOB_ID,\"p_status\":\"failed\",\"p_err\":\"Озвучка перервалась (див. журнал запуску на GitHub)\"}" || true

  # Голос Apple (з 13.11.2026): ПУБЛІЧНИЙ репозиторій (стандартні раннери безкоштовні), Intel-Mac (стартують одразу,
  # на відміну від Apple Silicon). Книга ділиться на 5 серверів (ліміт Mac на акаунт): кожен пише свою частку,
  # перетворює в mp3 і кладе архів у тимчасову теку сховища (tmp/..., не артефакти GitHub: їх у публічному
  # репозиторії може завантажити будь-хто); apple-join на Linux збирає книгу, публікує й прибирає tmp/.
  apple:
    if: github.event_name == 'workflow_dispatch' && inputs.gender == 'apple'
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3, 4]
    runs-on: macos-26-intel
    timeout-minutes: 120
    env:
      EPUB_URL: ${{ inputs.epub_url }}
      GENDER: apple
      SHARDS: '5'
      JOB_ID: ${{ inputs.job_id }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_KEY_ID: ${{ secrets.R2_KEY_ID }}
      R2_SECRET: ${{ secrets.R2_SECRET }}
      R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      READER_UPLOAD_KEY: ${{ secrets.READER_UPLOAD_KEY }}
      SHARD: ${{ matrix.shard }}
      STAGE: apple-shard
      APPLE_DIR: apple-parts
      APPLE_JOBS: '4'
    steps:
      - name: Сховати посилання на EPUB у журналі (репозиторій публічний)
        run: |
          echo "::add-mask::$EPUB_URL"
          for t in $(echo "$EPUB_URL" | grep -oE '[a-f0-9]{32}'); do echo "::add-mask::$t"; done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install mutagen imageio-ffmpeg
      - name: Запис голосом Apple (Леся, Мілена, Samantha) і mp3, частина ${{ matrix.shard }}
        run: python3 tool/cloud_job.py

  apple-join:
    needs: apple
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EPUB_URL: ${{ inputs.epub_url }}
      GENDER: apple
      SHARDS: '5'
      JOB_ID: ${{ inputs.job_id }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_KEY_ID: ${{ secrets.R2_KEY_ID }}
      R2_SECRET: ${{ secrets.R2_SECRET }}
      R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      READER_UPLOAD_KEY: ${{ secrets.READER_UPLOAD_KEY }}
      STAGE: apple-join
    steps:
      - name: Сховати посилання на EPUB у журналі (репозиторій публічний)
        run: |
          echo "::add-mask::$EPUB_URL"
          for t in $(echo "$EPUB_URL" | grep -oE '[a-f0-9]{32}'); do echo "::add-mask::$t"; done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install mutagen
      - name: Збірка книги з частин і завантаження
        run: python3 tool/cloud_job.py

  apple-failed:
    needs: [apple, apple-join]
    if: ${{ always() && inputs.gender == 'apple' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EPUB_URL: ${{ inputs.epub_url }}
      GENDER: apple
      SHARDS: '5'
      JOB_ID: ${{ inputs.job_id }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_KEY_ID: ${{ secrets.R2_KEY_ID }}
      R2_SECRET: ${{ secrets.R2_SECRET }}
      R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      READER_UPLOAD_KEY: ${{ secrets.READER_UPLOAD_KEY }}
      STAGE: apple-cleanup
    steps:
      - name: Сховати посилання на EPUB у журналі (репозиторій публічний)
        run: |
          echo "::add-mask::$EPUB_URL"
          for t in $(echo "$EPUB_URL" | grep -oE '[a-f0-9]{32}'); do echo "::add-mask::$t"; done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Прибрати тимчасові частини зі сховища
        run: python3 tool/cloud_job.py || true
      - name: Позначити задачу як невдалу (збій, скасування або перевищення часу)
        if: ${{ inputs.job_id != '' }}
        run: |
          curl -sS -m 30 -X POST "$SUPABASE_URL/rest/v1/rpc/reader_job_update" \
            -H "Content-Type: application/json" -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -d "{\"k\":\"$READER_UPLOAD_KEY\",\"p_job\":$JOB_ID,\"p_status\":\"failed\",\"p_err\":\"Озвучка голосом Apple перервалась (див. журнал запуску на GitHub)\"}" || true
